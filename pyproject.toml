[project]
name = "fl-studio-mcp"
version = "0.1.0"
description = "Comprehensive Model Context Protocol server for FL Studio — full control over transport, patterns, channels, mixer, plugins, piano roll, playlist, arrangement, automation and rendering."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "fLMCP" }]
dependencies = [
    "mcp[cli]>=1.2.0",
    "anyio>=4.0",
    "pydantic>=2.0",
    # macOS piano-roll trigger: Cmd+Opt+Y is posted as Quartz HID key events
    "pyobjc-framework-Quartz>=12.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
mac = ["PyQt5>=5.15"]
dev = ["pytest>=8"]

[project.scripts]
fl-studio-mcp = "fl_studio_mcp.server:main"
fl-studio-mcp-hotkey = "fl_studio_mcp.hotkey_button:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_studio_mcp"]
